[project]
name = "AlphaSAGE"
version = "0.1.0"
description = "Default template for PDM package"
dependencies = [
    "numpy>=1.26,<2.3",
    # CUDA wheels come from https://download.pytorch.org/whl/cu128 (needed for RTX 50 series)
    "torch>=2.7,<2.9",
    "torchvision>=0.22,<0.24",
    "torchaudio>=2.7,<2.9",
    "jinja2>=3.1.6",
    "gymnasium>=1.2.0",
    "gym==0.26.2",
    "stable-baselines3>=2.7.0",
    "pandera>=0.25.0",
    "pyqlib>=0.9.6",
    "baostock>=0.8.9",
    "sb3-contrib>=2.7.0",
    "opencv-python>=4.11.0.86",
    "joblib==1.3.2",
    "tensorboard>=2.20.0",
    "seaborn>=0.13.2",
    "torchgfn>=1.2.1",
    # 0.1.4 fails with torch>=2.3 ("Cannot subclass _TensorBase directly")
    "torchtyping>=0.1.5",
    "torch-geometric>=2.6.1",
    "xgboost>=3.0.5",
    "yahooquery>=2.4.1",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
